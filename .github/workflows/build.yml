name: Build & Publish Image

# 构建并推送 dsh 镜像到 GHCR。
# 触发方式：手动 / 镜像相关文件变更 / 被 check-update 工作流调用。

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - docker-entrypoint.sh
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 覆盖 dsh 版本（留空则读 Dockerfile 里的 DSH_VERSION）
        required: false
        type: string
  workflow_call:
    inputs:
      dsh_version:
        description: 覆盖 dsh 版本（留空则读 Dockerfile 里的 DSH_VERSION）
        required: false
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve dsh version
        id: ver
        run: |
          V="${{ inputs.dsh_version }}"
          if [ -z "$V" ]; then
            V=$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile)
          fi
          echo "Building with DSH_VERSION=$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # GHCR 要求镜像名全小写
      - name: Normalize image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
