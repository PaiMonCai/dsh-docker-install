name: Build & Publish Standard Image

# PR：校验脚本并实际构建 amd64/arm64，但不推送镜像。
# main 发布 dev；v<SemVer> 标签发布版本与正式浮动 tag；随后独立触发衍生版。
# 基础版发布成功即可结束本次工作流；科研版在另一条工作流里构建。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - ci/**
      - dshd
      - install.sh
      - docker-compose.yml
      - .env.example
      - docs/**
      - tests/**
      - .github/workflows/build.yml
      - .github/workflows/promote-release.yml
      - .github/workflows/dispatch-edition.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - ci/**
      - dshd
      - install.sh
      - docker-compose.yml
      - .env.example
      - docs/**
      - tests/**
      - .github/workflows/build.yml
      - .github/workflows/promote-release.yml
      - .github/workflows/dispatch-edition.yml
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 覆盖 dsh 版本（留空则读 Dockerfile 里的 DSH_VERSION）
        required: false
        type: string
      channel_tags:
        description: 上游 npm 通道元数据，逗号分隔；不决定镜像发布通道
        required: false
        type: string
  workflow_call:
    outputs:
      promoted:
        value: ${{ jobs.promote.outputs.promoted }}
      base_image:
        value: ${{ jobs.promote.outputs.base_image }}
      version:
        value: ${{ jobs.promote.outputs.version }}
      source_sha:
        value: ${{ jobs.promote.outputs.source_sha }}
      channels:
        value: ${{ jobs.promote.outputs.channels }}
    inputs:
      skip_dispatch:
        description: Updater reconciles derivatives separately instead of dispatching twice
        required: false
        type: boolean
        default: false
      preflight_only:
        description: Validate upstream DSH without publishing images
        required: false
        type: boolean
        default: false
      dsh_version:
        description: 覆盖 dsh 版本（留空则读 Dockerfile 里的 DSH_VERSION）
        required: false
        type: string
      channel_tags:
        description: 上游 npm 通道元数据，逗号分隔；不决定镜像发布通道
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      candidate_suffix: ${{ steps.metadata.outputs.candidate_suffix }}
    permissions:
      contents: read
      packages: write
      actions: write # 允许独立触发 Research 的 workflow_dispatch
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n dshd
          bash -n install.sh
          bash -n tests/test-install-bootstrap.sh
          bash tests/test-install-bootstrap.sh
          bash tests/test-dshd-web-management.sh
          bash tests/test-dshd-web-switch.sh
          python3 tests/test-web-manager.py
          node --test tests/test-management-operations.mjs tests/test-instance-manager.mjs tests/test-instance-manager-ui.cjs
          node --check docker/plugins/dsh-instance-manager/client.js
          node --test tests/test-prompt-manager.mjs tests/test-prompt-manager-ui.cjs
          node --test tests/test-context-manager-phase1.mjs tests/test-context-manager-phase2.mjs tests/test-context-manager-phase3.mjs tests/test-context-manager-phase4.mjs tests/test-context-manager-phase5.mjs
          bash -n tests/test-dshd-storage.sh
          bash tests/test-dshd-storage.sh
          bash tests/test-dshd-rollback.sh
          node --test tests/test-icon-dock.cjs
          bash -n tests/test-dshd-mounts.sh
          bash tests/test-dshd-mounts.sh
          bash -n tests/test-dshd-dashboard.sh
          bash tests/test-dshd-dashboard.sh
          bash -n tests/test-dshd-admin-hosts.sh
          bash tests/test-dshd-admin-hosts.sh
          bash -n tests/test-dshd-interactive.sh
          bash tests/test-dshd-interactive.sh
          bash -n tests/test-dshd-rescue-menu.sh
          bash tests/test-dshd-rescue-menu.sh
          bash -n tests/test-dshd-plugin-doctor.sh
          bash tests/test-dshd-plugin-doctor.sh
          bash -n tests/test-dshd-search-menu.sh
          bash tests/test-dshd-search-menu.sh
          bash -n tests/test-dshd-search-recovery.sh
          bash tests/test-dshd-search-recovery.sh
          bash -n tests/test-dshd-proxy.sh
          bash tests/test-dshd-proxy.sh
          bash -n tests/test-reasoning-editor.sh
          bash tests/test-reasoning-editor.sh
          bash -n tests/test-dsh-session-manager.sh
          bash tests/test-dsh-session-manager.sh
          node --check docker/plugins/dsh-session-manager-web/index.js
          node --check docker/plugins/dsh-session-manager-web/client.js
          node tests/test-session-manager-web.mjs
          node tests/test-session-trash-ui.cjs
          node --check docker/dsh-plugin-doctor.js
          node tests/test-plugin-doctor.cjs
          node --check tests/test-web-browser-e2e.cjs
          node --test tests/test-web-browser-onboarding.cjs
          node tests/test-connection-rpc-routes.js
          node --test tests/test-bili-domain-ui.cjs
          node --test tests/test-remote-settings-patch.cjs
          node --test tests/test-upstream-patches.cjs
          node --test tests/test-reverse-plugin-parity.cjs
          node --check docker/dsh-web-token.js
          node --check docker/patch-web-launch-token.js
          node docker/patch-web-launch-token.js --self-test
          node docker/patch-connection-rpc-routes.js --self-test
          node tests/test-web-token.js
          bash -n docker/entrypoint.sh
          node --check docker/prepare-native-web-plugins.js
          bash tests/test-native-web-plugins.sh
          sh -n docker/cn-mirror.sh
          node --check docker/plugins/dsh-reasoning-editor/index.js
          node --check docker/plugins/dsh-reasoning-editor/client.js
          node --check docker/patch-remote-settings.js
          node --check docker/patch-workspace-picker-home.js
          node --check docker/patch-plugin-hub-origin.js
          node --check docker/resolve-bind-host.js
          node tests/test-bind-host.js
          node --check docker/dsh-healthcheck.js
          node tests/test-dsh-healthcheck.js
          node docker/patch-plugin-hub-origin.js --self-test
          bash -n tests/test-dsh-market-docker-restart.sh
          bash tests/test-dsh-market-docker-restart.sh
          bash -n ci/image-tags.sh
          bash tests/test-image-tags.sh
          bash tests/test-research-release-gate.sh
          node tests/test-release-workflows.mjs
          node --test tests/test-release-contract.mjs
          bash research/tests/test-quarto-smoke.sh
          bash -n ci/reverse-push-gate.sh
          bash tests/test-reverse-release-gate.sh
          bash tests/test-dshd-reverse-install.sh
          node --test tests/test-reverse-edition.cjs
          node tests/test-semver-max.mjs

      - name: Verify published billion-context domain UI adapter
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          archive="$(npm pack 'billion-context@0.1.197' --ignore-scripts --silent --pack-destination "$tmp")"
          tar -xzf "$tmp/$archive" -C "$tmp"
          DSH_BILI_PACKAGE_ROOT="$tmp/package" node --test tests/test-bili-published-client.cjs
          npm install --prefix "$tmp/router" --ignore-scripts --no-audit --no-fund '@deepseek-ai/dsh-host-webserver@0.2.1-alpha.4'
          DSH_WEBSERVER_PACKAGE_ROOT="$tmp/router/node_modules/@deepseek-ai/dsh-host-webserver" node --test tests/test-bili-published-router.cjs

      # Regression for upstream 0.2.1-alpha.3, where Host persistence is native.
      # Test the published bundle rather than assuming source and bundle match.
      - name: Verify published DSH alpha.3 Settings compatibility
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          archive="$(npm pack '@deepseek-ai/dsh-client-ui-settings@0.2.1-alpha.3' --silent --pack-destination "$tmp")"
          package_dir="$tmp/npm-root/@deepseek-ai/dsh-client-ui-settings"
          mkdir -p "$package_dir"
          tar -xzf "$tmp/$archive" -C "$package_dir" --strip-components=1
          DSH_SETTINGS_NPM_ROOT="$tmp/npm-root" node docker/patch-remote-settings.js

      # Exercise the published Connection bundle with the same source adapters
      # used by Docker builds. This catches upstream layout drift before image build.
      - name: Verify published DSH alpha.3 Connection adapters
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          archive="$(npm pack '@deepseek-ai/dsh-client-connection@0.2.1-alpha.3' --silent --pack-destination "$tmp")"
          package_dir="$tmp/npm-root/@deepseek-ai/dsh-client-connection"
          mkdir -p "$package_dir"
          tar -xzf "$tmp/$archive" -C "$package_dir" --strip-components=1
          DSH_PATCH_NPM_ROOT="$tmp/npm-root" node docker/patch-connection-rpc-routes.js
          DSH_PATCH_NPM_ROOT="$tmp/npm-root" node docker/patch-web-launch-token.js
          DSH_PATCH_NPM_ROOT="$tmp/npm-root" node docker/patch-connection-rpc-routes.js
          DSH_PATCH_NPM_ROOT="$tmp/npm-root" node docker/patch-web-launch-token.js

      - name: Resolve dsh version
        id: ver
        run: |
          V="${{ inputs.dsh_version }}"
          if [ -z "$V" ]; then
            V=$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile)
          fi
          echo "Building with DSH_VERSION=$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Early candidate gate: probe exactly the release under test (including
      # workflow_call preflight updates), not only a historical regression tag.
      - name: Verify selected DSH version source adapters
        env:
          DSH_CANDIDATE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$DSH_CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected DSH version: $DSH_CANDIDATE_VERSION" >&2
            exit 1
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for package in dsh-client-ui-settings dsh-client-connection; do
            archive="$(npm pack "@deepseek-ai/${package}@${DSH_CANDIDATE_VERSION}" --silent --pack-destination "$tmp")"
            package_dir="$tmp/npm-root/@deepseek-ai/$package"
            mkdir -p "$package_dir"
            tar -xzf "$tmp/$archive" -C "$package_dir" --strip-components=1
          done
          DSH_SETTINGS_NPM_ROOT="$tmp/npm-root" node docker/patch-remote-settings.js
          DSH_PATCH_NPM_ROOT="$tmp/npm-root" node docker/patch-connection-rpc-routes.js
          DSH_PATCH_NPM_ROOT="$tmp/npm-root" node docker/patch-web-launch-token.js
          # Connection adapters must be safe to apply twice to the same bundle.
          DSH_PATCH_NPM_ROOT="$tmp/npm-root" node docker/patch-connection-rpc-routes.js
          DSH_PATCH_NPM_ROOT="$tmp/npm-root" node docker/patch-web-launch-token.js

      - name: Normalize image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Resolve release metadata once
        id: metadata
        env:
          RESOLVED_VERSION: ${{ steps.ver.outputs.version }}
          REQUESTED_CHANNELS: ${{ inputs.channel_tags }}
        run: |
          set -euo pipefail
          node ci/release.mjs publication
          node ci/release.mjs tree standard
          echo "candidate_suffix=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          channels="$(bash ci/image-tags.sh --channels-only "$RESOLVED_VERSION" "$REQUESTED_CHANNELS")"
          echo "channels=$channels" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # A smoke-tested amd64 image is mandatory BEFORE any multi-arch GHCR push,
      # including scheduled upstream upgrades. Building alone is not a release gate.
      - name: Build amd64 audit image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.version }}
          tags: dsh-ci:pr
          cache-from: type=gha
          # Keep the previous ARM64 cache until the multi-platform export.

      - name: Exercise Web managed restart and transactional replacement
        run: sudo env "PATH=$PATH" bash tests/test-instance-manager-runtime.sh dsh-ci:pr

      # Image-owned Web modules are discovered from their package manifests.
      # Adding one without declaring its native launcher patch must fail here.
      - name: Verify complete Standard Web plugin inventory
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint node dsh-ci:pr - snapshot \
            < ci/reverse-web-parity.cjs > "$RUNNER_TEMP/standard-web-plugins.json"
          node - "$RUNNER_TEMP/standard-web-plugins.json" <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (!report.plugins.length || !report.overlays.length) process.exit(1)
          console.log('Discovered ' + report.plugins.length + ' Standard plugin bundles; ' +
            report.plugins.filter(p => p.web).length + ' Web clients, ' +
            report.overlays.length + ' native launcher overlays')
          NODE

      # A source-level test cannot catch missing Python shared libraries or
      # a broken Granian/SearXNG install. Probe the actual built image offline.
      - name: Smoke-test embedded SearXNG in audit image
        run: |
          docker run --rm --entrypoint node dsh-ci:pr --input-type=module -e '
            import { EmbeddedSearxng, SEARCH_ENDPOINT } from "/opt/dsh/plugins/dsh-web-search/embedded.js"
            const service = new EmbeddedSearxng({ home: "/tmp/dsh-search-ci" })
            try {
              await service.ensureStarted()
              const response = await fetch(SEARCH_ENDPOINT + "/", { signal: AbortSignal.timeout(5000) })
              if (!response.ok) throw Error("embedded SearXNG returned HTTP " + response.status)
              console.log("Embedded SearXNG is listening on loopback only")
            } finally { await service.stop() }
          '

      - name: Check bundled Search Router
        run: bash tests/test-web-search-plugin.sh

      - name: Verify runtime development capabilities
        shell: bash
        run: |
          docker run --rm --entrypoint bash dsh-ci:pr -c '
            set -euo pipefail
            grep -qx ID=ubuntu /etc/os-release
            grep -Eq VERSION_ID.*24.04 /etc/os-release
            node --version | grep -q ^v24
            npm --version
            pnpm --version
            /opt/dsh/searxng-venv/bin/python -c "import sys; assert sys.version_info[:2] == (3, 12)"
            python3 --version
            python3 -m pip --version
            uv --version
            tmp_venv="$(mktemp -d)/venv"
            python3 -m venv "$tmp_venv"
            "$tmp_venv/bin/python" --version
            test -x /usr/local/go/bin/go
            go version
            tmp_go="$(mktemp -d)"
            cat >"$tmp_go/main.go" <<'"'"'EOF'"'"'
          package main
          import "fmt"
          func main() { fmt.Println("go toolchain ok") }
          EOF
            (cd "$tmp_go" && go build -o hello main.go && ./hello)
            docker --version
            docker buildx version
            docker compose version
            chromium --version
            playwright --version
            dsh --version
            # Built-in Web plugins load from native launcher patch paths
            # and never run dsh plugin add, pnpm or web Profile installers.
            for plugin in dsh-icon-dock dsh-session-manager-web dsh-web-search dsh-reasoning-editor dsh-instance-manager dsh-prompt-manager; do
              test -f "/opt/dsh/plugins/$plugin/package.json"
              test -f "/opt/dsh/plugins/$plugin/index.js"
              test -f "/opt/dsh/plugins/$plugin/client.js"
              test -f "/opt/dsh/plugins/$plugin/cordis.patch.yml"
            done
            test -f /usr/local/bin/prepare-dsh-native-web-plugins.js
            test ! -e /usr/local/bin/compose-dsh-native-web-patch.js
            test ! -e /usr/local/bin/ensure-dsh-web-search
            test ! -e /usr/local/bin/ensure-dsh-reasoning-editor
            test ! -e /usr/local/bin/ensure-dsh-icon-dock
            native_home="$(mktemp -d)"
            DSH_HOME="$native_home" dsh --profile web \
              --patch /opt/dsh/plugins/dsh-icon-dock/cordis.patch.yml \
              --dump-config | grep -Fq "dsh-docker-icon-dock"
            DSH_HOME="$native_home" dsh --profile web \
              --patch /opt/dsh/plugins/dsh-reasoning-editor/cordis.patch.yml \
              --dump-config | grep -Fq "dsh-docker-reasoning-editor"
            DSH_HOME="$native_home" dsh --profile web \
              --patch /opt/dsh/plugins/dsh-prompt-manager/cordis.patch.yml \
              --dump-config | grep -Fq "dsh-docker-prompt-manager"
            # Search defaults to official; an explicit SearXNG overlay opts into local search.
            DSH_HOME="$native_home" dsh --profile web \
              --patch /opt/dsh/plugins/dsh-web-search/cordis.patch.yml \
              --dump-config | grep -Fq "searchProvider: deepseek-official"
            DSH_HOME="$native_home" dsh --profile web \
              --patch /opt/dsh/plugins/dsh-web-search/cordis.searxng.patch.yml \
              --dump-config | grep -Fq "searchProvider: dsh-docker-search"
            # DSH launcher supports multiple --patch flags BEFORE app args.
            DSH_HOME="$native_home" dsh --profile web \
              --patch /opt/dsh/dsh-bind.patch.yml \
              --patch /opt/dsh/plugins/dsh-icon-dock/cordis.patch.yml \
              --patch /opt/dsh/plugins/dsh-session-manager-web/cordis.patch.yml \
              --patch /opt/dsh/plugins/dsh-reasoning-editor/cordis.patch.yml \
              --patch /opt/dsh/plugins/dsh-web-search/cordis.patch.yml \
              --dump-config | grep -Fq "dsh-docker-icon-dock"
            rm -rf "$native_home"
            test ! -e /usr/local/go/doc
            test ! -e /usr/local/go/test
            test ! -e /usr/local/bin/cn-mirror
            test ! -e /usr/local/bin/patch-remote-settings.js
            test ! -e /usr/local/bin/patch-workspace-picker-home.js
          '

      - name: Verify native prompt assembly and tool policy against image packages
        run: |
          docker run --rm --entrypoint node \
            -e DSH_PROMPT_RUNTIME_ROOT=/usr/local/lib/node_modules/@deepseek-ai/dsh \
            -e DSH_PROMPT_PLUGIN_ROOT=/opt/dsh/plugins/dsh-prompt-manager \
            -v "$PWD/tests/test-prompt-manager-published.mjs:/tmp/test-prompt-manager-published.mjs:ro" \
            dsh-ci:pr --test /tmp/test-prompt-manager-published.mjs

      - name: Verify Web bind through published Docker port
        shell: bash
        run: |
          set -euo pipefail
          name="dsh-ci-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          token_volume="dsh-ci-token-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm "$token_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$token_volume" >/dev/null
          docker run -d --name "$name" -v "$token_volume:/root/.dsh" -p 127.0.0.1::3080 \
            -e DSH_CONTEXT_MANAGER_PROBE=true \
            -e DSH_CONTEXT_MANAGER_CI_EXPECT_PRESETS=standard dsh-ci:pr
          mapped_port="$(docker port "$name" 3080/tcp | head -n 1)"
          mapped_port="${mapped_port##*:}"
          [[ "$mapped_port" =~ ^[0-9]+$ ]]
          for _ in {1..90}; do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$name")" != 'true' ]]; then
              docker logs "$name"
              exit 1
            fi
            code="$(curl -sS --max-time 2 -o /dev/null -w '%{http_code}' "http://127.0.0.1:${mapped_port}/" 2>/dev/null || true)"
            case "$code" in
              200|302|303|401)
                echo "DSH Web is reachable through Docker port mapping (HTTP $code)"
                break
                ;;
            esac
            sleep 1
          done
          if [[ "$code" != 200 && "$code" != 302 && "$code" != 303 && "$code" != 401 ]]; then
            docker logs "$name"
            echo "::error::DSH Web did not become reachable through Docker port mapping"
            exit 1
          fi

          # Probe the exact runtime bind IP from inside the running container.
          # This catches the old 127.0.0.1-only HEALTHCHECK regression.
          docker exec "$name" node /usr/local/bin/dsh-healthcheck.js
          docker inspect "$name" --format '{{json .Config.Healthcheck.Test}}' \
            | grep -Fq '/usr/local/bin/dsh-healthcheck.js'
          health="starting"
          for _ in {1..25}; do
            health="$(docker inspect "$name" --format '{{.State.Health.Status}}')"
            [[ "$health" == healthy ]] && break
            sleep 2
          done
          if [[ "$health" != healthy ]]; then
            docker inspect "$name" --format '{{json .State.Health}}'
            echo "::error::DSH runtime healthcheck did not reach healthy"
            exit 1
          fi
          echo "DSH Docker healthcheck reports healthy"
          # The opt-in plugin must execute inside the *running* image, not merely
          # show up in --dump-config. It does not create or alter sessions.
          context_ready=""
          for _ in {1..50}; do
            context_ready="$(docker logs "$name" 2>&1 | grep 'DSH_CONTEXT_MANAGER_CI_READY' | tail -1 || true)"
            [[ -n "$context_ready" ]] && break
            sleep 1
          done
          if [[ -z "$context_ready" ]]; then
            echo "::error::Standard context manager failed to inspect official runtime preset inventory"
            docker logs "$name" | tail -100
            exit 1
          fi
          echo "$context_ready"

          # Native bundled Web plugins must be loaded from the immutable
          # image patch files, not Profile dependencies or pnpm state.
          docker exec -i "$name" node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const names = [
            'dsh-reasoning-editor', 'dsh-icon-dock', 'dsh-session-manager-web', 'dsh-instance-manager', 'dsh-prompt-manager'
          ]
          for (const name of names) {
            const base = '/opt/dsh/plugins/' + name
            for (const file of ['package.json', 'client.js', 'index.js', 'cordis.patch.yml']) {
              if (!fs.existsSync(path.join(base, file))) {
                throw new Error('Missing native Web plugin file: ' + name + '/' + file)
              }
            }
          }
          const profile = JSON.parse(fs.readFileSync('/root/.dsh/profiles/web/package.json', 'utf8'))
          const selected = profile.dsh?.profile?.bundles || []
          for (const name of [
            'dsh-docker-reasoning-editor',
            'dsh-docker-icon-dock',
            'dsh-docker-session-manager',
            'dsh-docker-web-search',
          ]) {
            if (selected.includes(name)) throw new Error('Legacy profile bundle still active: ' + name)
          }
          const processes = fs.readdirSync('/proc').filter(name => /^[0-9]+$/.test(name))
          const argSets = processes.map(pid => {
            try { return fs.readFileSync('/proc/' + pid + '/cmdline', 'utf8').split('\0') }
            catch { return [] }
          })
          const launch = argSets.find(args =>
            args.includes('web') && args.includes('--patch') &&
            args.some(arg => arg.endsWith('/dsh-bind.patch.yml')))
          if (!launch) throw new Error('Cannot locate DSH Web launcher with native overlays')
          const webStart = launch.indexOf('web')
          const appFlags = launch.indexOf('--no-open')
          if (webStart === -1 || appFlags === -1) throw new Error('Missing Web app flags')
          const actual = []
          for (let i = webStart + 1; i < appFlags; i++) {
            if (launch[i] === '--patch') actual.push(launch[++i])
          }
          const required = [
            '/opt/dsh/dsh-bind.patch.yml',
            ...names.map(name => '/opt/dsh/plugins/' + name + '/cordis.patch.yml'),
          ]
          for (const patch of required) {
            if (!actual.includes(patch)) throw new Error('Missing native launcher patch: ' + patch)
          }
          if (launch.slice(appFlags).includes('--patch')) {
            throw new Error('Launcher flags incorrectly placed after Web app flags')
          }
          console.log('Bundled Web plugins mounted as official repeatable --patch overlays')
          NODE

          # A rendered index does NOT prove the Web API route exists.
          # Built-in Files uses POST /api/workspaceFiles/list; without a browser
          # auth cookie it must be intercepted as 401 by Connection, not 405
          # from the static-resource fallback (nor 403 from the Host fence).
          rpc_url="http://127.0.0.1:${mapped_port}/api/workspaceFiles/list"
          response_file="$(mktemp)"
          status="$(curl -sS --max-time 8 -o "$response_file" -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            --data '{"type":"client-request","rpcId":"dsh-web-ci","method":"workspaceFiles/list","payload":{"args":[]}}' \
            "$rpc_url")"
          if [[ "$status" != 401 ]] || [[ "$(cat "$response_file")" != unauthorized ]]; then
            echo "::error::Built-in Files API route failed: POST /api/workspaceFiles/list returned $status, expected unauthenticated 401. Check Connection /api mount or reverse-proxy routing (405=static fallback)."
            docker logs "$name" | sed -E 's/(token=)[^&[:space:]]+/\\1[REDACTED]/g'
            rm -f "$response_file"
            exit 1
          fi
          rm -f "$response_file"
          echo "DSH built-in Files API route is mounted (unauthenticated POST -> 401)."

          # Exercise the real loaded Web plugin over authenticated Connection.
          # This temporary CI token is neither printed nor retained.
          token="$(docker logs "$name" 2>&1 | sed -nE 's/.*\?token=([A-Za-z0-9_-]+).*/\1/p' | tail -n 1)"
          if [[ -z "$token" ]]; then
            echo "::error::No Web login token was emitted"
            exit 1
          fi
          cookie_file="$(mktemp)"
          response_file="$(mktemp)"
          curl -sS --max-time 8 -c "$cookie_file" -o /dev/null \
            "http://127.0.0.1:${mapped_port}/?token=${token}"
          # Crucial browser-facing check: a running DSH Host and an active
          # backend API are insufficient if the Web boot module graph omits
          # an image-owned UI plugin. Verify the actual authenticated HTML.
          curl -fsS --max-time 10 -b "$cookie_file" \
            "http://127.0.0.1:${mapped_port}/" -o "$response_file"
          grep -Fq '__DSH_BOOT__' "$response_file" || {
            echo "::error::Web page lacks the DSH client module graph"
            exit 1
          }
          for plugin in dsh-docker-icon-dock dsh-docker-session-manager dsh-docker-reasoning-editor; do
            if ! grep -Fq "$plugin" "$response_file"; then
              echo "::error::Native Web client plugin missing from the actual browser boot manifest: $plugin"
              exit 1
            fi
          done
          echo "DSH browser boot manifest contains all mandatory native client plugins"
          status="$(curl -sS --max-time 8 -b "$cookie_file" \
            -o "$response_file" -w '%{http_code}' \
            "http://127.0.0.1:${mapped_port}/api/dsh-docker-session-manager")"
          if [[ "$status" != 200 ]] || ! grep -Fq '"items":[]' "$response_file"; then
            echo "::error::Authenticated Web session trash endpoint returned HTTP $status (expected 200 / empty trash)"
            rm -f "$cookie_file" "$response_file"
            exit 1
          fi
          rm -f "$cookie_file" "$response_file"
          echo "DSH Web session-manager authenticated trash route is mounted"

          doctor_report="$(mktemp)"
          if ! docker exec "$name" node /usr/local/bin/dsh-plugin-doctor.js --json >"$doctor_report"; then
            cat "$doctor_report"
            echo "::error::Native plugin runtime diagnostics failed"
            exit 1
          fi
          node - "$doctor_report" <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (!report.healthy || !report.checks.some(c => c.code === 'client-graph' && c.state === 'ok')) {
            throw new Error('Plugin doctor did not confirm browser boot graph')
          }
          NODE
          rm -f "$doctor_report"

          # Run real Chromium inside disposable CI Docker volume.
          if ! docker exec "$name" node /usr/local/bin/test-dsh-web-browser-e2e.cjs; then
            docker cp "$name:/tmp/dsh-web-e2e-failed.png" ./dsh-web-e2e-failed.png 2>/dev/null || true
            echo "::error::Chromium icon dock and settings smoke test failed"
            exit 1
          fi

          # Docker recreate must not change the launch Token. The second
          # container uses the same DSH_HOME volume, not just a process restart.
          test "$(docker exec "$name" node /usr/local/bin/dsh-web-token.js status)" = auto
          saved_token="$(docker exec "$name" node /usr/local/bin/dsh-web-token.js print)"
          [[ "$saved_token" == "$token" ]]
          docker rm -f "$name" >/dev/null
          docker run -d --name "$name" -v "$token_volume:/root/.dsh" -p 127.0.0.1::3080 dsh-ci:pr >/dev/null
          new_token=""
          for _ in {1..90}; do
            new_token="$(docker logs "$name" 2>&1 | sed -nE 's/.*\?token=([A-Za-z0-9_-]+).*/\1/p' | tail -n 1)"
            [[ -n "$new_token" ]] && break
            sleep 1
          done
          if [[ -z "$new_token" || "$new_token" != "$saved_token" ]]; then
            echo "::error::Web login Token changed after container recreate on the same volume"
            exit 1
          fi
          echo "DSH Web login Token is stable across Docker container recreates"




      - name: Verify native Session cold replay across Docker recreation
        if: github.event_name == 'pull_request'
        shell: bash
        run: bash tests/test-context-manager-native-replay.sh dsh-ci:pr standard

      - name: Report image footprint
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          bytes="$(docker image inspect dsh-ci:pr --format '{{.Size}}')"
          mib="$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1024 / 1024 }')"
          echo "DSH audit image size: ${mib} MiB (${bytes} bytes)"

          docker run --rm --entrypoint bash dsh-ci:pr -lc \
            'du -sh /usr/local/go /usr/local/lib/node_modules /ms-playwright /usr/lib /usr/bin 2>/dev/null || true' \
            | tee /tmp/dsh-footprint.txt

          baseline=""
          if docker pull "${{ steps.img.outputs.name }}:latest" >/dev/null 2>&1; then
            baseline_bytes="$(docker image inspect "${{ steps.img.outputs.name }}:latest" --format '{{.Size}}')"
            baseline_mib="$(awk -v b="$baseline_bytes" 'BEGIN { printf "%.1f", b / 1024 / 1024 }')"
            baseline="- Current published latest (local uncompressed): **${baseline_mib} MiB** (${baseline_bytes} bytes)"
          fi

          {
            echo "### DSH image footprint"
            echo
            echo "- PR audit image (local uncompressed): **${mib} MiB** (${bytes} bytes)"
            if [ -n "$baseline" ]; then
              echo "$baseline"
            fi
            echo
            echo "#### Major runtime paths"
            echo '~~~text'
            cat /tmp/dsh-footprint.txt
            echo '~~~'
            echo
            echo "#### Docker layers"
            echo '~~~text'
            docker history dsh-ci:pr --format '{{.Size}}\t{{.CreatedBy}}'
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && inputs.preflight_only != true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: publish
        if: inputs.preflight_only != true
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.caicailo.dsh.standard.revision=${{ github.sha }}
            io.caicailo.dsh.source.tree=${{ steps.metadata.outputs.tree }}
            io.caicailo.dsh.channels=${{ steps.metadata.outputs.channels }}
            io.caicailo.dsh.release.track=${{ steps.metadata.outputs.track }}
            io.caicailo.dsh.release.tag=${{ steps.metadata.outputs.release_tag }}
          tags: ${{ steps.img.outputs.name }}:candidate-standard-${{ steps.metadata.outputs.candidate_suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max



  promote:
    needs: build
    if: github.event_name != 'pull_request' && inputs.preflight_only != true
    uses: ./.github/workflows/promote-release.yml
    with:
      edition: standard
      candidate_suffix: ${{ needs.build.outputs.candidate_suffix }}
    permissions:
      contents: read
      packages: write

  dispatch-research:
    needs: promote
    if: needs.promote.outputs.promoted == 'true' && inputs.skip_dispatch != true
    uses: ./.github/workflows/dispatch-edition.yml
    with:
      edition: research
      base_image: ${{ needs.promote.outputs.base_image }}
      version: ${{ needs.promote.outputs.version }}
      source_sha: ${{ needs.promote.outputs.source_sha }}
      channels: ${{ needs.promote.outputs.channels }}
    permissions:
      contents: read
      actions: write

  dispatch-reverse:
    needs: promote
    if: needs.promote.outputs.promoted == 'true' && inputs.skip_dispatch != true
    uses: ./.github/workflows/dispatch-edition.yml
    with:
      edition: reverse
      base_image: ${{ needs.promote.outputs.base_image }}
      version: ${{ needs.promote.outputs.version }}
      source_sha: ${{ needs.promote.outputs.source_sha }}
      channels: ${{ needs.promote.outputs.channels }}
    permissions:
      contents: read
      actions: write
