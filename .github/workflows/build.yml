name: Build & Publish Image

# PR：校验脚本并实际构建 amd64/arm64，但不推送镜像。
# main / workflow_dispatch / workflow_call：构建并推送 GHCR。

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - ci/**
      - dshd
      - install.sh
      - docker-compose.yml
      - .env.example
      - docs/**
      - tests/**
      - .github/workflows/build.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - ci/**
      - dshd
      - install.sh
      - docker-compose.yml
      - .env.example
      - docs/**
      - tests/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 覆盖 dsh 版本（留空则读 Dockerfile 里的 DSH_VERSION）
        required: false
        type: string
      channel_tags:
        description: 额外镜像 tag，逗号分隔（如 alpha,next）；留空则按上游 npm dist-tag 自动推导
        required: false
        type: string
  workflow_call:
    inputs:
      preflight_only:
        description: Validate upstream DSH without publishing images
        required: false
        type: boolean
        default: false
      dsh_version:
        description: 覆盖 dsh 版本（留空则读 Dockerfile 里的 DSH_VERSION）
        required: false
        type: string
      channel_tags:
        description: 额外镜像 tag，逗号分隔（如 alpha,next）；留空则按上游 npm dist-tag 自动推导
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      base_image: ${{ steps.img.outputs.name }}@${{ steps.publish.outputs.digest }}
      dsh_version: ${{ steps.ver.outputs.version }}
      channels: ${{ steps.tags.outputs.channels }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n dshd
          bash -n install.sh
          bash -n tests/test-dshd-storage.sh
          bash tests/test-dshd-storage.sh
          bash -n tests/test-dshd-mounts.sh
          bash tests/test-dshd-mounts.sh
          bash -n tests/test-dshd-dashboard.sh
          bash tests/test-dshd-dashboard.sh
          bash -n tests/test-dshd-admin-hosts.sh
          bash tests/test-dshd-admin-hosts.sh
          bash -n tests/test-dshd-interactive.sh
          bash tests/test-dshd-interactive.sh
          bash -n tests/test-dshd-proxy.sh
          bash tests/test-dshd-proxy.sh
          bash -n tests/test-reasoning-editor.sh
          bash tests/test-reasoning-editor.sh
          bash -n tests/test-dsh-session-manager.sh
          bash tests/test-dsh-session-manager.sh
          node tests/test-session-manager-web.mjs
          node tests/test-connection-rpc-routes.js
          bash -n docker/entrypoint.sh
          bash -n docker/ensure-reasoning-editor.sh
          sh -n docker/cn-mirror.sh
          node --check docker/plugins/dsh-reasoning-editor/index.js
          node --check docker/plugins/dsh-reasoning-editor/client.js
          node --check docker/patch-remote-settings.js
          node --check docker/patch-workspace-picker-home.js
          node --check docker/patch-plugin-hub-origin.js
          node --check docker/resolve-bind-host.js
          node tests/test-bind-host.js
          node docker/patch-plugin-hub-origin.js --self-test
          bash -n tests/test-dsh-market-docker-restart.sh
          bash tests/test-dsh-market-docker-restart.sh
          bash -n ci/image-tags.sh
          bash tests/test-image-tags.sh
          node tests/test-semver-max.mjs

      - name: Resolve dsh version
        id: ver
        run: |
          V="${{ inputs.dsh_version }}"
          if [ -z "$V" ]; then
            V=$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile)
          fi
          echo "Building with DSH_VERSION=$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Normalize image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Compose image tags
        id: tags
        env:
          RESOLVED_IMAGE: ${{ steps.img.outputs.name }}
          RESOLVED_VERSION: ${{ steps.ver.outputs.version }}
          REQUESTED_CHANNELS: ${{ inputs.channel_tags }}
        run: |
          # :latest 始终指向最新一次构建；通道 tag（alpha / next / …）与上游
          # npm dist-tag 对齐，使 `docker pull <image>:alpha` 与
          # `npm i @deepseek-ai/dsh@alpha` 语义一致。查不到上游通道时只发布
          # 版本号与 latest，不阻断构建。
          #
          # 通道只解析一次：先取通道名（转发给 Research 构建，保证两边的通道一致），
          # 再用同一份通道组装标准镜像的 tag。
          set -euo pipefail
          channels="$(bash ci/image-tags.sh --channels-only "$RESOLVED_VERSION" "$REQUESTED_CHANNELS")"
          echo "channels: ${channels:-<none>}"
          tags_file="${RUNNER_TEMP:-/tmp}/dsh-image-tags.txt"
          bash ci/image-tags.sh "$RESOLVED_IMAGE" "$RESOLVED_VERSION" "$channels" | tee "$tags_file"
          {
            echo "list<<DSH_IMAGE_TAGS"
            cat "$tags_file"
            echo "DSH_IMAGE_TAGS"
            echo "channels=$channels"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # A smoke-tested amd64 image is mandatory BEFORE any multi-arch GHCR push,
      # including scheduled upstream upgrades. Building alone is not a release gate.
      - name: Build amd64 audit image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.version }}
          tags: dsh-ci:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify runtime development capabilities
        shell: bash
        run: |
          docker run --rm --entrypoint bash dsh-ci:pr -c '
            set -euo pipefail
            node --version
            npm --version
            pnpm --version
            python3 --version
            python3 -m pip --version
            uv --version
            tmp_venv="$(mktemp -d)/venv"
            python3 -m venv "$tmp_venv"
            "$tmp_venv/bin/python" --version
            test -x /usr/local/go/bin/go
            go version
            tmp_go="$(mktemp -d)"
            cat >"$tmp_go/main.go" <<'"'"'EOF'"'"'
          package main
          import "fmt"
          func main() { fmt.Println("go toolchain ok") }
          EOF
            (cd "$tmp_go" && go build -o hello main.go && ./hello)
            docker --version
            docker buildx version
            docker compose version
            chromium --version
            playwright --version
            dsh --version
            test -f /opt/dsh/plugins/dsh-reasoning-editor/package.json
            test -x /usr/local/bin/ensure-dsh-reasoning-editor
            reasoning_home="$(mktemp -d)"
            DSH_HOME="$reasoning_home" DSH_REASONING_EDITOR=true /usr/local/bin/ensure-dsh-reasoning-editor
            node - "$reasoning_home/profiles/web/package.json" <<'"'"'NODE'"'"'
          const fs = require("fs")
          const p = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))
          if (!p.dependencies?.["dsh-docker-reasoning-editor"]) process.exit(1)
          if (!p.dsh?.profile?.bundles?.includes("dsh-docker-reasoning-editor")) process.exit(1)
          NODE
            DSH_HOME="$reasoning_home" dsh --profile web --dump-config | grep -q "dsh-docker-reasoning-editor"
            DSH_HOME="$reasoning_home" DSH_REASONING_EDITOR=false /usr/local/bin/ensure-dsh-reasoning-editor
            node - "$reasoning_home/profiles/web/package.json" <<'"'"'NODE'"'"'
          const fs = require("fs")
          const p = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))
          if (p.dependencies?.["dsh-docker-reasoning-editor"]) process.exit(1)
          if (p.dsh?.profile?.bundles?.includes("dsh-docker-reasoning-editor")) process.exit(1)
          NODE
            test ! -e /usr/local/go/doc
            test ! -e /usr/local/go/test
            test ! -e /usr/local/bin/cn-mirror
            test ! -e /usr/local/bin/patch-remote-settings.js
            test ! -e /usr/local/bin/patch-workspace-picker-home.js
          '

      - name: Verify Web bind through published Docker port
        shell: bash
        run: |
          set -euo pipefail
          name="dsh-ci-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" -p 127.0.0.1::3080 dsh-ci:pr
          mapped_port="$(docker port "$name" 3080/tcp | head -n 1)"
          mapped_port="${mapped_port##*:}"
          [[ "$mapped_port" =~ ^[0-9]+$ ]]
          for _ in {1..90}; do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$name")" != 'true' ]]; then
              docker logs "$name"
              exit 1
            fi
            code="$(curl -sS --max-time 2 -o /dev/null -w '%{http_code}' "http://127.0.0.1:${mapped_port}/" 2>/dev/null || true)"
            case "$code" in
              200|302|303|401)
                echo "DSH Web is reachable through Docker port mapping (HTTP $code)"
                exit 0
                ;;
            esac
            sleep 1
          done
          docker logs "$name"
          echo "::error::DSH Web did not become reachable through Docker port mapping"
          exit 1

      - name: Report image footprint
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          bytes="$(docker image inspect dsh-ci:pr --format '{{.Size}}')"
          mib="$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1024 / 1024 }')"
          echo "DSH audit image size: ${mib} MiB (${bytes} bytes)"

          docker run --rm --entrypoint bash dsh-ci:pr -lc \
            'du -sh /usr/local/go /usr/local/lib/node_modules /ms-playwright /usr/lib /usr/bin 2>/dev/null || true' \
            | tee /tmp/dsh-footprint.txt

          baseline=""
          if docker pull "${{ steps.img.outputs.name }}:latest" >/dev/null 2>&1; then
            baseline_bytes="$(docker image inspect "${{ steps.img.outputs.name }}:latest" --format '{{.Size}}')"
            baseline_mib="$(awk -v b="$baseline_bytes" 'BEGIN { printf "%.1f", b / 1024 / 1024 }')"
            baseline="- Current published latest (local uncompressed): **${baseline_mib} MiB** (${baseline_bytes} bytes)"
          fi

          {
            echo "### DSH image footprint"
            echo
            echo "- PR audit image (local uncompressed): **${mib} MiB** (${bytes} bytes)"
            if [ -n "$baseline" ]; then
              echo "$baseline"
            fi
            echo
            echo "#### Major runtime paths"
            echo '~~~text'
            cat /tmp/dsh-footprint.txt
            echo '~~~'
            echo
            echo "#### Docker layers"
            echo '~~~text'
            docker history dsh-ci:pr --format '{{.Size}}\t{{.CreatedBy}}'
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && inputs.preflight_only != true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: publish
        if: inputs.preflight_only != true
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  research:
    name: Rebuild Research images
    needs: build
    if: ${{ github.event_name != 'pull_request' && inputs.preflight_only != true }}
    uses: ./.github/workflows/build-research.yml
    with:
      base_image: ${{ needs.build.outputs.base_image }}
      # 研究镜像的发布 tag 跟随它实际包住的 dsh 版本与通道。
      dsh_version: ${{ needs.build.outputs.dsh_version }}
      channel_tags: ${{ needs.build.outputs.channels }}
    permissions:
      contents: read
      packages: write
