name: Build & Publish Image

# PR：校验脚本并实际构建 amd64/arm64，但不推送镜像。
# main / workflow_dispatch / workflow_call：构建并推送 GHCR。

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - dshd
      - install.sh
      - .github/workflows/build.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - dshd
      - install.sh
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 覆盖 dsh 版本（留空则读 Dockerfile 里的 DSH_VERSION）
        required: false
        type: string
  workflow_call:
    inputs:
      dsh_version:
        description: 覆盖 dsh 版本（留空则读 Dockerfile 里的 DSH_VERSION）
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n dshd
          bash -n install.sh
          bash -n tests/test-dshd-storage.sh
          bash tests/test-dshd-storage.sh
          bash -n tests/test-dshd-dashboard.sh
          bash tests/test-dshd-dashboard.sh
          bash -n docker/entrypoint.sh
          sh -n docker/cn-mirror.sh
          node --check docker/patch-remote-settings.js
          node --check docker/patch-plugin-hub-origin.js
          node docker/patch-plugin-hub-origin.js --self-test

      - name: Resolve dsh version
        id: ver
        run: |
          V="${{ inputs.dsh_version }}"
          if [ -z "$V" ]; then
            V=$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile)
          fi
          echo "Building with DSH_VERSION=$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Normalize image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
