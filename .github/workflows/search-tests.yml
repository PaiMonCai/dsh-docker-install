name: Web Search Checks
on:
  pull_request:
    paths:
      - 'docker/plugins/dsh-web-search/**'
      - 'docker/plugins/dsh-icon-dock/**'
      - 'docker/prepare-native-web-plugins.js'
      - 'docker/plugins/dsh-reasoning-editor/**'
      - 'docker/plugins/dsh-session-manager-web/**'
      - 'tests/test-icon-dock.cjs'
      - 'tests/test-native-web-plugins.sh'
      - 'docker/search/**'
      - 'dshd'
      - 'Dockerfile'
      - 'docker/entrypoint.sh'
      - 'docker-compose.yml'
      - 'tests/test-web-search.mjs'
      - 'tests/test-embedded-web-search.mjs'
      - 'tests/test-dshd-search-menu.sh'
      - 'tests/test-dshd-search-recovery.sh'
      - 'tests/test-web-search-plugin.sh'
      - 'tests/test-web-search-sidebar.cjs'
      - 'tests/test-dshd-rollback.sh'
      - 'tests/test-dshd-instances.sh'
      - 'tests/test-dshd-navigation.sh'
      - '.github/workflows/search-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and unit tests
        run: |
          set -euo pipefail
          bash -n dshd
          bash tests/test-dshd-search-menu.sh
          bash tests/test-dshd-search-recovery.sh
          bash tests/test-dshd-rollback.sh
          bash tests/test-dshd-instances.sh
          bash tests/test-dshd-navigation.sh
          bash tests/test-dshd-reverse-install.sh
          bash tests/test-dshd-storage.sh
          bash tests/test-dshd-interactive.sh
          bash tests/test-dshd-mounts.sh
          bash tests/test-native-web-plugins.sh
          node --check docker/plugins/dsh-icon-dock/index.js
          node --check docker/plugins/dsh-icon-dock/client.js
          node --test tests/test-icon-dock.cjs
          bash -n docker/entrypoint.sh
          node --check docker/plugins/dsh-web-search/index.js
          node --check docker/plugins/dsh-web-search/client.js
          node --check docker/plugins/dsh-web-search/router.js
          node --check docker/plugins/dsh-web-search/embedded.js
          node --check docker/plugins/dsh-web-search/settings.js
          node --check docker/plugins/dsh-web-search/providers/searxng.js
          node --check docker/plugins/dsh-web-search/providers/brave.js
          bash tests/test-web-search-plugin.sh
          node --test tests/test-embedded-web-search.mjs
      - name: Profile package architecture
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const p = JSON.parse(fs.readFileSync('docker/plugins/dsh-web-search/package.json'))
          if (p.name !== 'dsh-docker-web-search') throw Error('wrong package')
          if (p.dsh.bundle.patch !== './cordis.patch.yml') throw Error('missing composition bundle')
          const patch = fs.readFileSync('docker/plugins/dsh-web-search/cordis.patch.yml','utf8')
          for(const value of ['searchProvider: dsh-docker-search','fetchProvider: http','searchTimeoutMs: 12000']) {
            if (!patch.includes(value)) throw Error('missing '+value)
          }
          const sh = fs.readFileSync('docker/entrypoint.sh','utf8')
          if (!sh.includes('append_native_web_patch') || sh.includes('dsh plugin --profile web add')) throw Error('must use official native launcher patch overlays')
          NODE
      - name: Compose syntax validation
        run: docker compose config --quiet
