name: Bootstrap one-time v0.1.2 release

# This workflow lives ONLY on the release-bootstrap branch, not on main.
# Tag creation with GITHUB_TOKEN does not fire push workflows, so explicitly
# dispatch the existing release pipeline at that immutable tag afterward.
on:
  push:
    branches: [release-bootstrap-v0.1.2]
    paths: [.github/workflows/release-bootstrap-v0.1.2.yml]

permissions:
  contents: write
  actions: write

jobs:
  create-tag-and-dispatch:
    if: github.repository == 'PaiMonCai/dsh-docker-install'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.2
      TARGET_SHA: fe5197b9f646cef8f091e2a969d484fe16fbae15
    steps:
      - name: Assert exact approved release source and tag absence
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$actual" != "$TARGET_SHA" ]]; then
            echo "::error::main changed from the previously verified release SHA; refuse to tag"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists; refuse to move or overwrite it"
            exit 1
          fi
          echo "Pinning new Git release $RELEASE_TAG to approved main SHA $TARGET_SHA"

      - name: Create annotated immutable Git release tag
        shell: bash
        run: |
          set -euo pipefail
          tag_object="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="Release $RELEASE_TAG: unified Web management and rescue CLI" \
            -f object="$TARGET_SHA" \
            -f type=commit --jq '.sha')"
          [[ "$tag_object" =~ ^[a-f0-9]{40}$ ]]
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_object" >/dev/null
          published="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          [[ "$published" == "$tag_object" ]] || {
            echo "::error::Release tag verification failed"
            exit 1
          }
          echo "Verified annotated Git tag $RELEASE_TAG."

      - name: Dispatch existing formal build at tagged ref
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          echo "Formal release requested via workflow_dispatch at $RELEASE_TAG."
          echo "Standard gates, GHCR promotion and edition dispatch remain enforced."
