name: Check dsh Updates (Development)

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: dsh-update-reconciliation
  cancel-in-progress: false
  queue: max

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      current: ${{ steps.check.outputs.current }}
      updated: ${{ steps.check.outputs.updated }}
      latest: ${{ steps.check.outputs.latest }}
      channels: ${{ steps.check.outputs.channels }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream versions
        id: check
        run: |
          set -euo pipefail
          CURRENT="$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile)"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 50 \
            https://registry.npmjs.org/@deepseek-ai/dsh -o "$RUNNER_TEMP/dsh-registry.json"
          mapfile -t DETECTED < <(node ci/semver-max.mjs "$CURRENT" < "$RUNNER_TEMP/dsh-registry.json")
          read -r LATEST IS_NEWER <<<"${DETECTED[0]:-}"
          CHANNELS="${DETECTED[1]:-}"
          [[ -n "$LATEST" && ( "$IS_NEWER" == true || "$IS_NEWER" == false ) ]]
          if [[ "$IS_NEWER" == false && "$LATEST" != "$CURRENT" ]]; then
            LATEST="$CURRENT"
            CHANNELS=""
          fi
          {
            echo "current=$CURRENT"
            echo "latest=$LATEST"
            echo "updated=$IS_NEWER"
            echo "channels=$CHANNELS"
          } >> "$GITHUB_OUTPUT"
      - name: Check development artifact even when the version is unchanged
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}
          TARGET_VERSION: ${{ steps.check.outputs.latest }}
        run: node ci/release.mjs plan

  # Runtime/browser audits and publication must succeed before recording the
  # source version. Only development tags are published; Git tags own releases.
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      dsh_version: ${{ needs.check.outputs.latest }}
      channel_tags: ${{ needs.check.outputs.channels }}
      skip_dispatch: true
    permissions:
      contents: read
      packages: write
      actions: write

  commit:
    needs: [check, build]
    if: >-
      always() && !cancelled() && needs.check.result == 'success' &&
      needs.check.outputs.updated == 'true' &&
      (needs.build.outputs.promoted == 'true' || needs.check.outputs.build == 'false')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record the successfully published development version
        env:
          CURRENT: ${{ needs.check.outputs.current }}
          LATEST: ${{ needs.check.outputs.latest }}
          TARGET_VERSION: ${{ needs.check.outputs.latest }}
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node ci/release.mjs verify
          actual="$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile)"
          if [[ "$actual" == "$LATEST" ]]; then exit 0; fi
          [[ "$actual" == "$CURRENT" ]] || { echo "::error::Version changed during publication"; exit 1; }
          sed -i "s/^ARG DSH_VERSION=.*/ARG DSH_VERSION=${LATEST}/" Dockerfile
          sed -i "s/^\(\s*DSH_VERSION: \)[\"']*${CURRENT}[\"']*$/\1\"${LATEST}\"/" docker-compose.yml
          sed -i "s/dsh:${CURRENT}/dsh:${LATEST}/g" docker-compose.yml README.md
          sed -i "s/DSH_VERSION=${CURRENT}/DSH_VERSION=${LATEST}/g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile docker-compose.yml README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump dsh ${CURRENT} -> ${LATEST}"
          git push origin HEAD:main

  reconcile:
    needs: [check, build, commit]
    if: >-
      always() && !cancelled() && needs.check.result == 'success' &&
      (needs.build.outputs.promoted == 'true' || needs.check.outputs.build == 'false')
    runs-on: ubuntu-24.04
    outputs:
      research: ${{ steps.state.outputs.research }}
      reverse: ${{ steps.state.outputs.reverse }}
      base_image: ${{ steps.state.outputs.base_image }}
      version: ${{ steps.state.outputs.version }}
      source_sha: ${{ steps.state.outputs.source_sha }}
      channels: ${{ steps.state.outputs.channels }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Find missing or outdated derivative artifacts
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}
        run: node ci/release.mjs reconcile

  dispatch-research:
    needs: reconcile
    if: always() && needs.reconcile.result == 'success' && needs.reconcile.outputs.research == 'true'
    uses: ./.github/workflows/dispatch-edition.yml
    with:
      edition: research
      base_image: ${{ needs.reconcile.outputs.base_image }}
      version: ${{ needs.reconcile.outputs.version }}
      source_sha: ${{ needs.reconcile.outputs.source_sha }}
      channels: ${{ needs.reconcile.outputs.channels }}
    permissions:
      contents: read
      actions: write

  dispatch-reverse:
    needs: reconcile
    if: always() && needs.reconcile.result == 'success' && needs.reconcile.outputs.reverse == 'true'
    uses: ./.github/workflows/dispatch-edition.yml
    with:
      edition: reverse
      base_image: ${{ needs.reconcile.outputs.base_image }}
      version: ${{ needs.reconcile.outputs.version }}
      source_sha: ${{ needs.reconcile.outputs.source_sha }}
      channels: ${{ needs.reconcile.outputs.channels }}
    permissions:
      contents: read
      actions: write
