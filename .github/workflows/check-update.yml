name: Check dsh Updates

# 定时检查 npm registry 上 @deepseek-ai/dsh 的最新版本（含 alpha/rc 预发布通道，
# 上游目前只发预发布版，latest dist-tag 不代表最新版本）：
# 有更新 -> 修改 Dockerfile / compose / README 中的版本号并提交 -> 调用 build 工作流构建。
# 同时把指向该版本的 npm dist-tag 通道名（alpha / next / latest）一并以检测时的快照
# 传给 build，让发布的镜像也打上与上游同名的通道 tag。
#
# 注意：用 GITHUB_TOKEN 提交的 push 不会触发其他工作流（GitHub 防递归限制），
# 所以这里用 reusable workflow（uses:）显式调用 build，并把新版本号作为输入传入，
# 不依赖 push 事件触发。

on:
  schedule:
    # 每天 UTC 02:23（北京时间 10:23）
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 提交版本变更

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.check.outputs.updated }}
      latest: ${{ steps.check.outputs.latest }}
      channels: ${{ steps.check.outputs.channels }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare versions
        id: check
        run: |
          # 上游所有版本（含 alpha/rc）都是预发布，latest dist-tag 会滞后，
          # 因此从 npm 全量版本列表里取 semver 最大者，而不是查 latest 标签。
          cat > /tmp/semver-max.js <<'EOF'
          let s = '';
          process.stdin.on('data', d => s += d).on('end', () => {
            const meta = JSON.parse(s);
            const vs = Object.keys(meta.versions);
            const parts = v => v.split(/[.-]/).map(x => /^\d+$/.test(x) ? Number(x) : x);
            const cmp = (a, b) => {
              const A = parts(a), B = parts(b);
              for (let i = 0; i < Math.max(A.length, B.length); i++) {
                const x = A[i], y = B[i];
                if (x === undefined) return 1;   // 正式版 > 预发布版
                if (y === undefined) return -1;
                if (x === y) continue;
                if (typeof x === typeof y) return x < y ? -1 : 1;
                return typeof x === 'number' ? -1 : 1;
              }
              return 0;
            };
            const latest = vs.sort(cmp).pop();
            // dist-tag 就是上游的发布通道；把当前指向 latest 的通道名一并输出，
            // 供 build 工作流给镜像补上同名 tag。
            const dist = meta['dist-tags'] || {};
            const channels = Object.keys(dist).filter(k => dist[k] === latest);
            console.log(latest + ' ' + (cmp(latest, process.argv[2]) > 0));
            console.log(channels.join(','));
          });
          EOF
          CURRENT=$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile)
          mapfile -t DETECTED < <(curl -fsSL https://registry.npmjs.org/@deepseek-ai/dsh | node /tmp/semver-max.js "$CURRENT")
          read -r LATEST IS_NEWER <<<"${DETECTED[0]:-}"
          CHANNELS="${DETECTED[1]:-}"
          if [[ -z "$LATEST" ]]; then
            echo "::warning::无法解析 @deepseek-ai/dsh 版本（registry 不可用？），本次跳过更新检查。"
          fi
          echo "current:  $CURRENT"
          echo "latest:   $LATEST"
          echo "channels: ${CHANNELS:-<none>}"
          {
            echo "current=$CURRENT"
            echo "latest=$LATEST"
            echo "updated=$IS_NEWER"
            echo "channels=$CHANNELS"
          } >> "$GITHUB_OUTPUT"

  # Avoid committing a potentially incompatible upstream DSH version.
  preflight:
    needs: check
    if: needs.check.outputs.updated == 'true'
    uses: ./.github/workflows/build.yml
    with:
      dsh_version: ${{ needs.check.outputs.latest }}
      preflight_only: true
    permissions:
      contents: read

  commit:
    needs: [check, preflight]
    if: needs.check.outputs.updated == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump version and commit
        run: |
          set -euo pipefail
          CURRENT="${{ needs.check.outputs.current }}"
          LATEST="${{ needs.check.outputs.latest }}"
          actual="$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile)"
          if [[ "$actual" != "$CURRENT" ]]; then
            echo "::error::DSH version changed during preflight: expected $CURRENT, found $actual"
            exit 1
          fi
          sed -i "s/^ARG DSH_VERSION=.*/ARG DSH_VERSION=${LATEST}/" Dockerfile
          sed -i "s/^\(\s*DSH_VERSION: \)[\"']*${CURRENT}[\"']*$/\1\"${LATEST}\"/" docker-compose.yml
          sed -i "s/dsh:${CURRENT}/dsh:${LATEST}/g" docker-compose.yml README.md
          sed -i "s/DSH_VERSION=${CURRENT}/DSH_VERSION=${LATEST}/g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile docker-compose.yml README.md
          git diff --cached --quiet && { echo "::error::No version changes staged"; exit 1; }
          git commit -m "chore: bump dsh ${CURRENT} -> ${LATEST}"
          git push


  build:
    needs: [check, commit]
    if: needs.check.outputs.updated == 'true'
    uses: ./.github/workflows/build.yml
    with:
      dsh_version: ${{ needs.check.outputs.latest }}
      channel_tags: ${{ needs.check.outputs.channels }}
    permissions:
      contents: read
      packages: write
