name: Build & Publish Research Image

on:
  push:
    branches: [main]
    paths:
      - research/**
      - .github/workflows/build-research.yml
  pull_request:
    branches: [main, chore/context-manager-m0-audit, 'feat/context-manager-*']
    paths:
      - research/**
      - .github/workflows/build-research.yml
      - Dockerfile
      - .dockerignore
      - docker/**
      - ci/**
      - .github/workflows/build.yml
      - .github/workflows/promote-release.yml
      - dshd
      - install.sh
      - docker-compose.yml
      - .env.example
      - docs/**
      - tests/**
      - .github/workflows/dispatch-edition.yml
  workflow_dispatch:
    inputs:
      base_image:
        description: Standard 镜像；留空按当前 Git ref 解析 dev 或标签版本，并固定 digest
        required: false
        type: string
      dsh_version:
        description: 可选的 Standard 版本约束；实际版本从基础镜像合同读取
        required: false
        type: string
      channel_tags:
        description: 可选通道约束；默认继承 Standard 发布时记录的通道
        required: false
        type: string
      source_sha:
        description: Standard 镜像的源码 commit，用于验证基础镜像溯源
        required: false
        type: string
  workflow_call:
    inputs:
      base_image:
        description: 已发布的基础镜像引用，推荐使用 digest 固定依赖
        required: false
        type: string
        default: ""
      dsh_version:
        description: 可选的 Standard 版本约束
        required: false
        type: string
        default: ""
      channel_tags:
        description: 可选通道约束；默认继承 Standard 发布时记录的通道
        required: false
        type: string
        default: ""
      source_sha:
        description: Standard 镜像的源码 commit；不会改变 Research checkout
        required: false
        type: string
        default: ""
permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Mixed Standard+Research commits should never start Research on push.
  # Standard's post-publish dispatch will create a new independent run with
  # the exact base digest and source commit.
  prepare:
    name: Determine Research build trigger
    runs-on: ubuntu-24.04
    outputs:
      run_research: ${{ steps.gate.outputs.run_research == 'true' && steps.base.outputs.ready != 'false' }}
      candidate: ${{ steps.candidate.outputs.candidate }}
      image: ${{ steps.base.outputs.image }}
      base_image: ${{ steps.base.outputs.base_image }}
      digest: ${{ steps.base.outputs.digest }}
      candidate_suffix: ${{ steps.base.outputs.candidate_suffix }}
      version: ${{ steps.base.outputs.version }}
      channels: ${{ steps.base.outputs.channels }}
      tree: ${{ steps.base.outputs.tree }}
      track: ${{ steps.base.outputs.track }}
      release_tag: ${{ steps.base.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Skip mixed push until Standard publishes
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            should_run="$(bash ci/research-push-gate.sh "$BEFORE_SHA" "$GITHUB_SHA")"
          else
            should_run=true
          fi
          echo "run_research=$should_run" >> "$GITHUB_OUTPUT"
          if [[ "$should_run" == false ]]; then
            echo "Same push changed Standard and Research: wait for Standard dispatch."
          fi

      - name: Detect changed Standard base on PR
        id: candidate
        if: github.event_name == 'pull_request' && steps.gate.outputs.run_research == 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(bash ci/research-push-gate.sh "$PR_BASE_SHA" "$GITHUB_SHA")"
          if [[ "$changed" == false ]]; then
            echo "candidate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve one immutable Standard contract
        id: base
        if: steps.gate.outputs.run_research == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE: ${{ env.IMAGE_NAME }}
          REQUESTED_BASE: ${{ inputs.base_image }}
          REQUESTED_VERSION: ${{ inputs.dsh_version }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_CHANNELS: ${{ inputs.channel_tags }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
        run: |
          set -euo pipefail
          echo "image=${RELEASE_IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "candidate_suffix=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          node ci/release.mjs publication
          node ci/release.mjs tree research
          if [[ "$CANDIDATE" == true ]]; then
            echo "base_image=dsh-standard-ci:research" >> "$GITHUB_OUTPUT"
            echo "version=$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile)" >> "$GITHUB_OUTPUT"
            echo "channels=" >> "$GITHUB_OUTPUT"
          else
            node ci/release.mjs resolve
          fi

  build:
    name: build (${{ matrix.tag }})
    needs: prepare
    if: ${{ needs.prepare.outputs.run_research == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      candidate_suffix: ${{ needs.prepare.outputs.candidate_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: research-final
            tag: research
          - target: research-economics
            tag: research-economics
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Reserve disk for candidate base and derived layers
        if: github.event_name == 'pull_request' && needs.prepare.outputs.candidate == 'true'
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
          free -h

      - name: Validate Research scripts
        run: |
          bash -n research/bin/research-init
          PYTHONPATH=research python -m py_compile research/bin/research-run
          bash -n research/bin/research-archive
          python -m py_compile research/bin/research-literature
          PYTHONPATH=research python -m py_compile research/bin/research-status research/bin/research-migrate research/bin/research-check research/bin/research-data research/bin/research-pipeline research/bin/research-result research/bin/research-dashboard
          PYTHONPATH=research python -m compileall -q research/dsh_research
          PYTHONPATH=research python -m unittest discover -s research/tests -p 'test_*.py' -v
          python -m py_compile research/packs/economics/bin/research-econ-data
          python -m py_compile research/packs/economics/bin/research-econ-model
          python -m py_compile research/packs/economics/bin/research-econ-did
          PYTHONPATH=research python research/bin/research-run --self-test
          python research/bin/research-literature --self-test
          PYTHONPATH=research python research/bin/research-status --self-test
          PYTHONPATH=research python research/bin/research-migrate --self-test
          PYTHONPATH=research python research/bin/research-check --self-test
          PYTHONPATH=research python research/bin/research-data --self-test
          PYTHONPATH=research python research/bin/research-pipeline --self-test
          PYTHONPATH=research python research/bin/research-result --self-test
          PYTHONPATH=research python research/bin/research-dashboard --self-test
          grep -q 'DSH_RESEARCH_FULL_SELF_TEST' research/packs/economics/bin/research-econ-model
          grep -q 'DSH_RESEARCH_FULL_SELF_TEST' research/packs/economics/bin/research-econ-did
          node --check research/dsh_research/dashboard_assets/app.js
          node --check research/adapter/index.js
          bash -n research/adapter/dsh-wrapper
          bash -n research/adapter/smoke-web.sh
          bash research/tests/test-adapter-smoke.sh
          bash research/tests/test-quarto-smoke.sh
          node research/tests/test-adapter.mjs
          bash research/tests/test-adapter-wrapper.sh
          grep -q '^schema: 2$' research/templates/default/research.yaml
          grep -q '^schema: 2$' research/templates/packs/economics/research.yaml
          grep -q 'status: "active"' research/templates/default/research.yaml
          test -s research/templates/default/AGENTS.md
          test -s research/templates/default/literature/evidence-matrix.csv
          test -s research/templates/default/data/catalog/README.md
          test -s research/templates/default/pipeline.yaml
          test -s research/templates/default/results/registry/README.md
          bash -n ci/image-tags.sh
          bash tests/test-image-tags.sh

      - name: V2 RC integration gate
        run: |
          bash -n research/tests/rc-gate.sh
          bash research/tests/rc-gate.sh

      - name: Read Research version
        id: ver
        run: echo "version=$(cat research/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Normalize image name
        id: img
        run: echo "name=$RELEASE_IMAGE" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_IMAGE: ${{ needs.prepare.outputs.image }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build candidate Standard and Research together
        if: github.event_name == 'pull_request' && needs.prepare.outputs.candidate == 'true'
        env:
          AUDIT_IMAGE: ${{ needs.prepare.outputs.image }}:${{ matrix.tag }}
          RESEARCH_VERSION: ${{ steps.ver.outputs.version }}
          RESEARCH_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Preserve progress visibility during large, otherwise silent exports.
          while sleep 30; do echo "Candidate Standard/Research build is still running"; done &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          docker build --pull -f Dockerfile -t dsh-standard-ci:research .
          docker build --pull=false -f research/Dockerfile --target "$RESEARCH_TARGET" \
            --build-arg BASE_IMAGE=dsh-standard-ci:research \
            --build-arg RESEARCH_VERSION="$RESEARCH_VERSION" -t "$AUDIT_IMAGE" .

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: needs.prepare.outputs.candidate != 'true'
        with:
          context: .
          file: research/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          pull: true
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base_image }}
            RESEARCH_VERSION=${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.caicailo.dsh.version=${{ needs.prepare.outputs.version }}
            io.caicailo.dsh.edition=${{ matrix.tag }}
            io.caicailo.dsh.source.tree=${{ needs.prepare.outputs.tree }}
            io.caicailo.dsh.base.digest=${{ needs.prepare.outputs.digest }}
            io.caicailo.dsh.channels=${{ needs.prepare.outputs.channels }}
            io.caicailo.dsh.release.track=${{ needs.prepare.outputs.track }}
            io.caicailo.dsh.release.tag=${{ needs.prepare.outputs.release_tag }}
          tags: ${{ needs.prepare.outputs.image }}:${{ github.event_name == 'pull_request' && matrix.tag || format('candidate-{0}-{1}', matrix.tag, needs.prepare.outputs.candidate_suffix) }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      - name: Verify built-in native context plugin lifecycle
        if: github.event_name == 'pull_request'
        env:
          AUDIT_IMAGE: ${{ steps.img.outputs.name }}:${{ matrix.tag }}
        run: bash tests/test-context-manager-native-plugin.sh "$AUDIT_IMAGE" standard

      - name: Report Research image footprint
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          AUDIT_IMAGE: ${{ steps.img.outputs.name }}:${{ matrix.tag }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          set -euo pipefail
          bytes="$(docker image inspect "$AUDIT_IMAGE" --format '{{.Size}}')"
          mib="$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1024 / 1024 }')"
          paths="$(docker run --rm --entrypoint bash "$AUDIT_IMAGE" -lc \
            'du -sh /opt/dsh-research/venv /usr/share/texlive /usr/local/go /ms-playwright /tmp/dsh-cache 2>/dev/null || true')"
          baseline=""
          # Keep the candidate tag and disk budget for the actual PR image.
          if [[ "$CANDIDATE" != true ]] && docker pull "$AUDIT_IMAGE" >/dev/null 2>&1; then
            baseline_bytes="$(docker image inspect "$AUDIT_IMAGE" --format '{{.Size}}')"
            baseline_mib="$(awk -v b="$baseline_bytes" 'BEGIN { printf "%.1f", b / 1024 / 1024 }')"
            baseline="- Current published tag (local uncompressed): **${baseline_mib} MiB** (${baseline_bytes} bytes)"
          fi
          {
            echo "### DSH ${{ matrix.tag }} image footprint"
            echo
            echo "- PR audit image (local uncompressed): **${mib} MiB** (${bytes} bytes)"
            if [ -n "$baseline" ]; then echo "$baseline"; fi
            echo
            echo '#### Major runtime paths'
            echo '~~~text'
            printf '%s\n' "$paths"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: build
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/promote-release.yml
    with:
      edition: research
      candidate_suffix: ${{ needs.build.outputs.candidate_suffix }}
    permissions:
      contents: read
      packages: write
