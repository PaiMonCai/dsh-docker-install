name: Build & Publish Research Image

on:
  push:
    branches: [main]
    paths:
      - research/**
      - .github/workflows/build-research.yml
  pull_request:
    branches: [main]
    paths:
      - research/**
      - .github/workflows/build-research.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build (${{ matrix.tag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: research-final
            tag: research
          - target: research-economics
            tag: research-economics
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate Research scripts
        run: |
          bash -n research/bin/research-init
          bash -n research/bin/research-run
          bash -n research/bin/research-archive
          python -m py_compile research/bin/research-literature
          PYTHONPATH=research python -m py_compile research/bin/research-status research/bin/research-migrate
          PYTHONPATH=research python -m compileall -q research/dsh_research
          PYTHONPATH=research python -m unittest discover -s research/tests -p 'test_*.py' -v
          python -m py_compile research/packs/economics/bin/research-econ-data
          python -m py_compile research/packs/economics/bin/research-econ-model
          python -m py_compile research/packs/economics/bin/research-econ-did
          python research/bin/research-literature --self-test
          PYTHONPATH=research python research/bin/research-status --self-test
          PYTHONPATH=research python research/bin/research-migrate --self-test
          grep -q '^schema: 2$' research/templates/default/research.yaml
          grep -q '^schema: 2$' research/templates/packs/economics/research.yaml
          grep -q 'status: "active"' research/templates/default/research.yaml
          test -s research/templates/default/AGENTS.md
          test -s research/templates/default/literature/evidence-matrix.csv

      - name: Read Research version
        id: ver
        run: echo "version=$(cat research/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Normalize image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: research/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE_IMAGE=${{ steps.img.outputs.name }}:latest
            RESEARCH_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ matrix.tag }}
            ${{ steps.img.outputs.name }}:${{ matrix.tag }}-${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
 research/templates/default/research.yaml
          test -s research/templates/default/AGENTS.md
          test -s research/templates/default/literature/evidence-matrix.csv

      - name: Read Research version
        id: ver
        run: echo "version=$(cat research/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Normalize image name
