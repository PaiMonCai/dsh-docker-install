name: Promote validated release
on:
  workflow_call:
    inputs:
      edition:
        type: string
        required: true
      candidate_suffix:
        type: string
        required: true
    outputs:
      promoted:
        value: ${{ jobs.promote.outputs.promoted }}
      base_image:
        value: ${{ jobs.promote.outputs.base_image }}
      version:
        value: ${{ jobs.promote.outputs.version }}
      source_sha:
        value: ${{ jobs.promote.outputs.source_sha }}
      channels:
        value: ${{ jobs.promote.outputs.channels }}
permissions:
  contents: read
  packages: write
jobs:
  promote:
    runs-on: ubuntu-latest
    # Build jobs never hold this lock. Check freshness and move public tags
    # together; a mixed push cannot cancel a running promotion.
    concurrency:
      group: dsh-release-promotion-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    outputs:
      promoted: ${{ steps.release.outputs.promoted }}
      base_image: ${{ steps.release.outputs.base_image }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      channels: ${{ steps.release.outputs.channels }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check freshness and promote immutable candidates
        id: release
        env:
          RELEASE_EDITION: ${{ inputs.edition }}
          CANDIDATE_SUFFIX: ${{ inputs.candidate_suffix }}
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ci/release.mjs promote "$RELEASE_EDITION"
