# Web Search plugin stays installed in both modes so its Settings UI is reachable.
# The provider is pinned at Web startup; the official provider is never replaced
# when SearXNG is disabled. Config updates replace the whole row.
- insert:
    - id: dsh-docker-web-search
      name: ./index.js

- id: web
  config:
    searchProvider: deepseek-official
    fetchProvider: http

- id: tool-web
  config:
    fetch: true
    search: true
    searchTimeoutMs: 12000
