# DSH WebServer now requires one concrete bind address. Wildcards such as
# 0.0.0.0 are rejected upstream because they expose the Web API on all interfaces.
# The Docker entrypoint resolves DSH_BIND_HOST to the container's interface IP.
# Direct launches (including Research build smokes) default safely to loopback.
#
# --host takes precedence over DSH_BIND_HOST; keep the upstream CLI override.
# The patch replaces the whole webserver config, so retain all compression keys.
- id: webserver
  config:
    host: !!js ctx.webStartup.host ?? process.env.DSH_BIND_HOST ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
