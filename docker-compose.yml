services:
  dsh:
    build:
      context: .
      args:
        # 与 Dockerfile 中的默认值保持一致；升级时改这里（check-update 工作流会自动维护）。
        DSH_VERSION: "0.1.5-rc.2"
        # 与 dsh 0.1.5-rc.2 官方 packageManager 保持一致。
        PNPM_VERSION: "11.7.0"
        # auto=自动检测国内网络并切镜像源；yes/no 强制指定
        IN_CHINA: auto
        # 有真实 HTTP 代理时取消注释
        # HTTPS_PROXY: http://127.0.0.1:7890
    image: dsh:latest
    container_name: dsh
    restart: unless-stopped
    # 只映射到宿主机回环：浏览器访问 http://127.0.0.1:3080 时 Host 是回环，天然受信任。
    # 需要从外网/局域网访问时，推荐在前面放 Nginx/Caddy 反向代理，
    # 并用 DSH_TRUSTED_HOSTS 声明对外域名。
    ports:
      - "127.0.0.1:3080:3080"
    environment:
      # 也可改用 GUI 的 Models 页面写入 $DSH_HOME/.credentials.yaml（持久卷里）。
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # 自定义 DeepSeek 兼容 API 时取消注释；不设置则走官方默认地址。
      # DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL}"
      # 逗号分隔的对外域名/authority，例如 "dsh.example.com,dsh.internal:3080"
      DSH_TRUSTED_HOSTS: "${DSH_TRUSTED_HOSTS:-}"
      # 需要换端口时同步改这里和 ports、healthcheck。
      # DSH_PORT: "3080"
      # 内核若无法提供 bubblewrap/Landlock，文件沙箱不可用，可临时关闭（见 README）。
      # DSH_PERMISSION_MODE: "danger-full-access"
    volumes:
      - dsh-home:/root/.dsh
      # 宿主机项目目录 → 容器的 workspace（默认工作目录）
      - "${DSH_WORKSPACE:-./workspace}:/workspace"
volumes:
  dsh-home:
