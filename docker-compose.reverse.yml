# Reverse Edition: separate port (3081), named volume and workspace.
# docker compose -f docker-compose.reverse.yml up -d --build
name: dsh-reverse
services:
  dsh-reverse:
    build:
      context: .
      dockerfile: reverse/Dockerfile
      # Refresh the Standard base when rebuilding locally, not a stale cached :latest.
      pull: true
      args:
        BASE_IMAGE: "${DSH_REVERSE_BASE_IMAGE:-ghcr.io/paimoncai/dsh-docker-install:latest}"
    image: "${DSH_REVERSE_IMAGE:-dsh:reverse}"
    container_name: dsh-reverse
    restart: unless-stopped
    shm_size: "${DSH_REVERSE_SHM_SIZE:-1g}"
    ports:
      - "127.0.0.1:${DSH_REVERSE_PORT:-3081}:3080"
    environment:
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DSH_TRUSTED_HOSTS: "${DSH_REVERSE_TRUSTED_HOSTS:-}"
      DSH_REVERSE_AGENT_PATCH: /opt/dsh-reverse/cordis.patch.yml
      # Match Standard's image-owned Web extension switches; Reverse keeps an
      # isolated DSH_HOME, so Standard's profile preferences do not carry over.
      DSH_REASONING_EDITOR: "${DSH_REASONING_EDITOR:-true}"
      DSH_ICON_DOCK_ENABLED: "${DSH_ICON_DOCK_ENABLED:-true}"
      DSH_SESSION_MANAGER_WEB: "${DSH_SESSION_MANAGER_WEB:-true}"
      DSH_PROMPT_MANAGER: "${DSH_PROMPT_MANAGER:-true}"
      DSH_CONTEXT_MANAGER_PROBE: "${DSH_CONTEXT_MANAGER_PROBE:-true}"
      DSH_CONTEXT_MANAGER_TIERED_ACTIVE: "${DSH_CONTEXT_MANAGER_TIERED_ACTIVE:-0}"
      DSH_CONTEXT_MANAGER_TIERED_OWNER_TESTED: "${DSH_CONTEXT_MANAGER_TIERED_OWNER_TESTED:-0}"
      DSH_CONTEXT_MANAGER_NO_EXTERNAL_PROXY: "${DSH_CONTEXT_MANAGER_NO_EXTERNAL_PROXY:-0}"
      DSH_SEARCH_ENABLED: "${DSH_SEARCH_ENABLED:-false}"
      DSH_SEARCH_SEARXNG_URL: "http://127.0.0.1:18788"
      DSH_SEARCH_BRAVE_ENABLED: "${DSH_SEARCH_BRAVE_ENABLED:-false}"
      DSH_SEARCH_BRAVE_DAILY_LIMIT: "${DSH_SEARCH_BRAVE_DAILY_LIMIT:-50}"
      DSH_SEARCH_CACHE_ENABLED: "${DSH_SEARCH_CACHE_ENABLED:-true}"
      DSH_DOCKER_RESTART: container
      NPM_CONFIG_CACHE: /tmp/npm-cache
      TZ: "${DSH_TIMEZONE:-Asia/Shanghai}"
    volumes:
      - dsh-reverse-home:/root/.dsh
      - "${DSH_REVERSE_WORKSPACE:-./reverse-workspace}:/workspace"
    # Reverse workspace and private volume deliberately separate from Standard.
volumes:
  dsh-reverse-home:
